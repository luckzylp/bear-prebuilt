name: Bear Prebuilt

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  BEAR_REPO: rizsotto/Bear

jobs:
  get-version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.get-tag.outputs.tag }}

    steps:
      - name: Get latest Bear release tag
        id: get-tag
        shell: bash
        run: |
          LATEST_TAG=$(curl -fsSL \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/rizsotto/Bear/releases/latest \
            | jq -r .tag_name)
          echo "tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
          echo "Latest Bear version: $LATEST_TAG"

  build:
    needs: get-version
    # macOS runner is pinned to macos-15 because the macos-latest alias
    # auto-migrates to macOS 26 on 2026-06-15 (see
    # https://github.com/actions/runner-images/issues/14167). macOS 26
    # is expected to ship SDK/toolchain changes that we have not yet
    # validated against Bear 4.x. Update this pin once we've confirmed
    # Bear still builds cleanly on the new image.
    runs-on: ${{ contains(matrix.target, 'windows') && 'windows-latest' || contains(matrix.target, 'darwin') && 'macos-15' || 'ubuntu-latest' }}

    strategy:
      fail-fast: false
      matrix:
        target:
          # Linux (glibc high)
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - armv7-unknown-linux-gnueabihf
          - i686-unknown-linux-gnu

          # Linux (glibc 2.17)
          - x86_64-unknown-linux-gnu.2.17
          - aarch64-unknown-linux-gnu.2.17
          - armv7-unknown-linux-gnueabihf.2.17
          - i686-unknown-linux-gnu.2.17

          # Windows (MSVC)
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc

          # macOS
          - x86_64-apple-darwin
          - aarch64-apple-darwin

    steps:
      - name: Checkout Bear prebuilt repo
        uses: actions/checkout@v6
        with:
          path: bear-prebuilt

      - name: Checkout Bear
        uses: actions/checkout@v6
        with:
          repository: ${{ env.BEAR_REPO }}
          ref: ${{ needs.get-version.outputs.tag }}
          path: bear-prebuilt/Bear
          clean: true
          fetch-depth: 1

      - name: Patch atomic write for Windows file locking
        working-directory: bear-prebuilt/Bear
        shell: bash
        run: |
          # On Windows, std::fs::rename fails when compile_commands.json
          # is locked by another process (clangd, IDE, antivirus),
          # leaving only a .tmp file. This patch adds retry-with-backoff
          # and a copy fallback to the atomic writer.
          # Remove this step once the fix is merged upstream.
          #
          # Strip CRLF from both the target file and the patch: on Windows
          # runners, actions/checkout converts LF to CRLF for both, which
          # causes git apply context-line mismatches.
          sed -i 's/\r$//' crates/bear/src/output/writers/atomic.rs
          sed 's/\r$//' ../scripts/patch-atomic-write-windows.patch | git apply --whitespace=fix -

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ contains(matrix.target, 'windows') && 'x86_64-pc-windows-msvc,aarch64-pc-windows-msvc' || '' }}

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Install cargo-zigbuild
        if: "!contains(matrix.target, 'windows')"
        run: cargo install cargo-zigbuild --locked

      - name: Add Rust target (Linux/macOS)
        if: "!contains(matrix.target, 'windows')"
        run: |
          TARGET="${{ matrix.target }}"
          TARGET="${TARGET%.2.17}"
          rustup target add "$TARGET"
          # When building x86_64, also add i686 so the multilib step
          # below can fold 32-bit artifacts into the same .deb.
          if [[ "$TARGET" == "x86_64-unknown-linux-gnu" ]]; then
            rustup target add i686-unknown-linux-gnu
          fi

      - name: Add Rust target (Windows)
        if: contains(matrix.target, 'windows')
        run: pwsh -Command "'${{ matrix.target }}'.Replace('.2.17', '') | ForEach-Object { rustup target add $_ }"

      # Bear v3+ (Rust) configures the runtime preload-library lookup
      # directory through the INTERCEPT_LIBDIR env var at build time
      # (see crates/intercept-supervisor/build.rs and
      # crates/intercept-supervisor/src/installation.rs). Runtime paths
      # are compiled in via cargo:rustc-env.
      #
      # On glibc Linux we use the `$LIB` token (see Bear's INSTALL.md
      # and `man ld.so`). bear-driver constructs the path
      # `/usr/libexec/bear/$LIB/libexec.so` literally (Rust PathBuf::join
      # keeps `$LIB` as a literal segment) and passes it as the
      # LD_PRELOAD value. glibc's dynamic linker expands `$LIB`
      # per-process at load time: on Debian/Ubuntu it resolves to the
      # multiarch subpath (e.g. `lib/x86_64-linux-gnu` for 64-bit,
      # `lib/i386-linux-gnu` for 32-bit). This enables transparent
      # multilib interception — a 64-bit bear-driver intercepts both
      # 64-bit and 32-bit compiler processes when both libexec.so
      # variants are installed (the amd64 deb ships both).
      - name: Build Bear (zigbuild)
        if: "!contains(matrix.target, 'windows')"
        working-directory: bear-prebuilt/Bear
        run: |
          # Cargo writes to target/<triple>/release/ by default.
          #
          # On glibc Linux, use the $LIB token so ld.so expands it to
          # the Debian multiarch subpath per process architecture.
          # On macOS, use a concrete directory name ($LIB is not
          # supported by the macOS dynamic linker).
          TARGET="${{ matrix.target }}"
          TARGET="${TARGET%.2.17}"
          case "$TARGET" in
              *linux*)              INTERCEPT_LIBDIR='$LIB' ;;
              *)                    INTERCEPT_LIBDIR="lib" ;;
          esac
          export INTERCEPT_LIBDIR
          echo "Building $TARGET with INTERCEPT_LIBDIR=$INTERCEPT_LIBDIR"
          cargo zigbuild --release --target "$TARGET"

      # Multilib: when this is an x86_64 (or x86_64 .2.17) build, also
      # produce a 32-bit i686 libexec.so so the deb packager can install
      # it alongside the 64-bit one at
      # /usr/libexec/bear/lib/i386-linux-gnu/libexec.so. The 64-bit
      # bear-driver (compiled with INTERCEPT_LIBDIR=$LIB) transparently
      # loads this 32-bit preload when intercepting 32-bit processes.
      - name: Build Bear i686 (multilib)
        if: >-
          (matrix.target == 'x86_64-unknown-linux-gnu' ||
           matrix.target == 'x86_64-unknown-linux-gnu.2.17')
        working-directory: bear-prebuilt/Bear
        run: |
          export INTERCEPT_LIBDIR='$LIB'
          cargo zigbuild --release --target i686-unknown-linux-gnu

      - name: Build Bear (MSVC)
        if: contains(matrix.target, 'windows')
        working-directory: bear-prebuilt/Bear
        run: |
          cargo build --release --target ${{ matrix.target }}

      - name: Generate shell completions
        if: "!contains(matrix.target, 'windows')"
        working-directory: bear-prebuilt/Bear
        run: |
          # INSTALL.md step 3: generate shell completions for bash/zsh/fish/elvish.
          T="${{ matrix.target }}"
          T="${T%.2.17}"
          BIN="target/$T/release/generate-completions"
          if [ -x "$BIN" ]; then
            "$BIN" "target/$T/release/completions" || true
          fi

      - name: Install NSIS (Windows)
        if: contains(matrix.target, 'windows')
        run: choco install nsis -y

      - name: Install dpkg tools (Linux)
        if: "!contains(matrix.target, 'windows') && !contains(matrix.target, 'darwin')"
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev fakeroot

      - name: Create Windows Installer
        if: contains(matrix.target, 'windows')
        working-directory: bear-prebuilt
        run: pwsh scripts/create-windows-installer.ps1 -Version "${{ needs.get-version.outputs.tag }}" -TargetTriple "${{ matrix.target }}"

      - name: Create Debian Package
        if: "!contains(matrix.target, 'windows') && !contains(matrix.target, 'darwin')"
        working-directory: bear-prebuilt
        run: bash scripts/create-deb-package.sh "${{ needs.get-version.outputs.tag }}" "${{ matrix.target }}"

      - name: Create macOS Package
        if: contains(matrix.target, 'darwin')
        working-directory: bear-prebuilt
        run: bash scripts/create-macos-dmg.sh "${{ needs.get-version.outputs.tag }}" "${{ matrix.target }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.target }}
          path: bear-prebuilt/dist/*

  release:
    needs: [get-version, build]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bear-${{ needs.get-version.outputs.tag }}
          name: Bear ${{ needs.get-version.outputs.tag }} (Prebuilt)
          body: |
            Automated prebuilt binaries and installers for Bear v${{ needs.get-version.outputs.tag }}

            ## Installation Paths

            These builds follow the layout described in Bear's official
            [INSTALL.md](https://github.com/rizsotto/Bear/blob/main/INSTALL.md):

            * **Linux** (Debian/Ubuntu): `/usr/bin/bear` (shell script)
              and `/usr/libexec/bear/{bin,lib}/` (`bear-driver`,
              `bear-wrapper`, `libexec.so`).
            * **Windows**: `C:\Program Files\Bear\` (NSIS installer;
              ships `bear-driver.exe`, `bear-wrapper.exe`, and a
              generated `bear.cmd` shim).
            * **macOS** (wrapper mode): `Bear.app/Contents/MacOS/install.sh`
              copies the same `/usr/libexec/bear/{bin,lib}/` layout
              into `/usr/libexec/bear/` and links `/usr/local/bin/bear`
              to `bear-driver`.

            The runtime lookup directory is compiled in at build time
            via the `INTERCEPT_LIBDIR` env var. On glibc Linux the
            `$LIB` token is used — ld.so expands it to the Debian
            multiarch subpath per process architecture, enabling
            transparent 32-bit/64-bit multilib interception on amd64.
            Elsewhere `lib` is used.

            ## Features
            * Built with cargo + zigbuild
            * Linux: glibc high & glibc 2.17 across x86_64, aarch64,
              armv7, and i686
            * macOS: wrapper-mode DMG installers for x86_64 and Apple Silicon
            * Windows: NSIS installer for x86_64 and aarch64
            * Shell completions for bash, zsh, fish, and elvish
          files: dist/**
